name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore Zift.slnx

    - name: Build solution
      run: dotnet build Zift.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test Zift.slnx --configuration Release --no-build
